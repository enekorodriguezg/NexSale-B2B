<VirtualHost *:80>
    ServerName localhost

    DocumentRoot "/usr/local/apache2/htdocs"
    <Directory "/usr/local/apache2/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"

    # Soporte para WebSockets
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://nexsale_api:8000/$1 [P,L]

    # Proxy selectivo hacia los routers de FastAPI (deja "/" libre para index.html)
    ProxyPassMatch ^/(auth|products|orders|health|docs|redoc|openapi\.json)(/.*)?$ http://nexsale_api:8000/$1$2
    ProxyPassReverse / http://nexsale_api:8000/

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>