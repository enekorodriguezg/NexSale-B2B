services:
  db:
    image: mysql:8.0
    container_name: nexorder_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexsale_net

  nexsale_api:
    build: .
    container_name: nexsale_api
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
    depends_on:
        db:
          condition: service_healthy
    networks:
      - nexsale_net

  apache:
    build: ./apache
    container_name: nexsale_apache
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/local/apache2/htdocs:ro
    depends_on:
      - nexsale_api
    networks:
      - nexsale_net

volumes:
  mysql_data:

networks:
  nexsale_net:
    driver: bridge
